                    "secondary": "#5a5f62",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3 {
            font-family: 'Raleway', sans-serif;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col transition-colors duration-300">
<!-- Theme Toggle (Fixed Position) -->
<button class="fixed top-6 right-6 p-2 rounded-full bg-surface-container hover:bg-surface-container-high transition-colors z-50" id="theme-toggle">
<span class="material-symbols-outlined text-primary" id="theme-icon">dark_mode</span>
</button>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-gutter-sm sm:p-gutter-lg relative overflow-hidden">
<!-- Subtle Ambient Background Element -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-tertiary/5 blur-[120px]"></div>
<!-- Login Card Container -->
<div class="w-full max-w-[440px] z-10">
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-8 sm:p-10 shadow-sm">
<!-- Logo and Branding -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center mb-4 text-on-primary-container">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">content_cut</span>
</div>
<h1 class="font-section-title text-section-title font-bold text-primary tracking-tight">TrimTrack</h1>
<p class="font-label-md text-label-md text-secondary uppercase tracking-widest mt-1">Barber Management</p>
</div>
<!-- Heading -->
<div class="mb-8">
<h2 class="font-page-title text-page-title text-on-surface mb-2">Welcome back</h2>
<p class="font-body-sm text-body-sm text-secondary">Please enter your details to access the administrator dashboard.</p>
</div>
<!-- Login Form -->
<form class="space-y-6" id="login-form">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface font-semibold" for="email">EMAIL ADDRESS</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body text-on-surface placeholder:text-outline/50" id="email" name="email" placeholder="admin@trimtrack.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface font-semibold" for="password">PASSWORD</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body text-on-surface placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors flex items-center justify-center p-1" id="toggle-password" type="button">
<span class="material-symbols-outlined text-xl" id="password-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Login Button -->
<div class="flex items-center space-x-2 pt-2">
<input class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface cursor-pointer select-none" for="remember">Remember this device for 30 days</label>
</div>
<button class="w-full py-4 bg-primary text-on-primary font-section-title text-base font-bold rounded-lg hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Login to Dashboard</span>
<span class="material-symbols-outlined">login</span>
</button>
</form>
<!-- Help Link -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-secondary">
                        Having trouble logging in? <a class="text-primary font-semibold hover:underline" href="#">Contact Support</a>
</p>
</div>
</div>
<!-- Footer Meta -->
<div class="mt-8 flex justify-center space-x-6">
<a class="font-label-md text-label-md text-outline hover:text-secondary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-md text-label-md text-outline hover:text-secondary transition-colors" href="#">Terms of Service</a>
<span class="font-label-md text-label-md text-outline">© 2024 TrimTrack Inc.</span>
</div>
</div>
</main>
<!-- Micro-interaction Scripts -->
<script>
        // Theme Toggling Logic
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                themeIcon.textContent = 'dark_mode';
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                themeIcon.textContent = 'light_mode';
            }
        });

        // Password Visibility Logic
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('toggle-password');
        const passwordIcon = document.getElementById('password-icon');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Form Submission Interaction (Mock)
        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = loginForm.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Loading State
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Authenticating...</span>
            `;

            // Simulate Network Delay
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> <span>Success</span>`;
                btn.classList.replace('bg-primary', 'bg-status-confirmed');
                setTimeout(() => {
                    // This is where a real redirect would happen
                    console.log('Redirecting to dashboard...');
                    btn.disabled = false;
                    btn.classList.remove('opacity-80', 'cursor-not-allowed');
                    btn.classList.replace('bg-status-confirmed', 'bg-primary');
                    btn.innerHTML = originalContent;
                }, 1000);
            }, 1500);
        });
    </script>
</body></html>
